{{define "payments_overdue"}}
<h1>Zaległe płatności <span class="count">({{.Count}})</span></h1>
{{if .Payments}}
<table>
    <thead>
        <tr>
            <th>Klient</th>
            <th>Karnet</th>
            <th>Kwota</th>
            <th>Termin</th>
            <th>Akcje</th>
        </tr>
    </thead>
    <tbody>
        {{range .Payments}}
        <tr>
            <td><a href="/clients/{{.ClientID}}" hx-get="/clients/{{.ClientID}}" hx-target="#content" hx-push-url="true">{{.ClientName}} {{.ClientSurname}}</a></td>
            <td>{{.TypeName}}</td>
            <td>{{formatPrice .Amount}} zł</td>
            <td style="color:#ef4444;">{{formatDate .DueDate}}</td>
            <td>
                <button class="btn btn-primary" style="font-size:0.8rem; padding:0.25rem 0.5rem;"
                    hx-post="/payments/{{.ID}}/pay"
                    hx-target="#content">Opłacono</button>
            </td>
        </tr>
        {{end}}
    </tbody>
</table>
{{else}}
<p style="color:#4ade80; padding:2rem 0; text-align:center;">Brak zaległych płatności 🎉</p>
{{end}}
{{end}}
