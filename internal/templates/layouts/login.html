{{define "login"}}
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Logowanie — Gym Manager</title>
    <script src="/static/htmx.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 2.5rem; width: 100%; max-width: 400px; }
        .login-card h1 { text-align: center; margin-bottom: 0.5rem; font-size: 1.5rem; color: #f8fafc; }
        .login-card .brand { text-align: center; font-size: 2rem; margin-bottom: 1rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.25rem; color: #94a3b8; font-size: 0.85rem; }
        .form-group input { width: 100%; background: #0f172a; border: 1px solid #334155; color: #e2e8f0; padding: 0.6rem 0.75rem; border-radius: 6px; font-size: 0.95rem; outline: none; }
        .form-group input:focus { border-color: #60a5fa; }
        .btn { width: 100%; padding: 0.65rem 1rem; border: none; border-radius: 6px; cursor: pointer; font-size: 0.95rem; font-weight: 600; background: #3b82f6; color: white; transition: background 0.15s; }
        .btn:hover { background: #2563eb; }
        .error { background: #7f1d1d; color: #fca5a5; padding: 0.5rem 0.75rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.85rem; text-align: center; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand">💪</div>
        <h1>Gym Manager</h1>
        <p style="text-align:center; color:#64748b; margin-bottom:1.5rem; font-size:0.85rem;">Zaloguj się, aby kontynuować</p>
        {{if .Error}}
        <div class="error">{{.Error}}</div>
        {{end}}
        <form method="POST" action="/login">
            <div class="form-group">
                <label for="login">Login</label>
                <input type="text" id="login" name="login" value="{{if .Login}}{{.Login}}{{end}}" autofocus required/>
            </div>
            <div class="form-group">
                <label for="password">Hasło</label>
                <input type="password" id="password" name="password" required/>
            </div>
            <button type="submit" class="btn">Zaloguj</button>
        </form>
    </div>
</body>
</html>
{{end}}
